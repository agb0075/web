<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA360 - Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <header class="cabecera-principal">
        <div class="logo"><a href="index.html">MODA360</a></div>
        <nav class="bloque-enlaces">
            <a href="index.html">INICIO</a>
            <a href="catalogo.html" class="active">TIENDA</a>
        </nav>
        <div class="iconos-cabecera">
            <span class="barra-busqueda">Buscar...</span>
            <span>📅</span>
            <span>🛒</span>
        </div>
    </header>

    <main class="contenedor-paginas">
        <section class="seccion-catalogo">
            <div class="cabecera-catalogo">
                <h2>CATÁLOGO</h2>
                <span class="cantidad">3 PIEZAS</span>
            </div>
            <div class="productos">
                <a href="producto.html" class="producto-caja caja-click">
                    <img src="./img/traje_lino.png" alt="Chaqueta">
                    <div class="informacion-producto">
                        <div>
                            <span class="categoria">CHAQUETAS</span>
                            <h3>TRAJE DE LINO</h3>
                        </div>
                        <span class="precio">85 €</span>
                    </div>
                </a>
                <div class="producto-caja">
                    <img src="./img/camisa_tierra.png" alt="Camisa">
                    <div class="informacion-producto">
                        <div>
                            <span class="categoria">CAMISAS</span>
                            <h3>CAMISA TIERRA</h3>
                        </div>
                        <span class="precio">29 €</span>
                    </div>
                </div>
                <div class="producto-caja">
                    <img src="./img/conjunto_matiz.png" alt="Conjunto">
                    <div class="informacion-producto">
                        <div>
                            <span class="categoria">CONJUNTOS</span>
                            <h3>CONJUNTO MATIZ</h3>
                        </div>
                        <span class="precio">75 €</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="titulo-footer">NUESTRA MANERA:</div>
        <div class="texto-footer">
            DISEÑAMOS MENOS, PERO MEJOR. MATERIALES HONESTOS, FORMAS DURADERAS Y UNA PALETA QUE VIVE BIEN CON TODO.
        </div>
        <div>&copy; 2026 MODA360</div>
    </footer>
</body>
</html>
